.lobby:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,18,.15) 0%,rgba(10,12,18,0) 45%,rgba(21,24,31,.92) 100%)}
.gp{position:absolute;z-index:2;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.28);
  border-radius:16px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.title{left:48%;top:22px;padding:14px 26px 12px;text-align:center;min-width:300px}
.title h1{font-size:30px;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.title h1 em{font-style:normal;color:var(--gold)}
.title .sub{font-size:12px;color:#dfe6f2;margin-top:3px}
.title .clk{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:6px}
.title .clk b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.title .clk span{font-size:11px;color:#cfd8e6}
.todo{right:18px;top:16px;width:330px;max-height:176px;padding:10px 14px;overflow:auto}
.todo h2{font-size:13px;font-weight:800;color:var(--gold);margin-bottom:6px}
.todo ul{list-style:none;display:grid;gap:4px}
.todo li{font-size:12px;line-height:1.35;display:flex;gap:6px;align-items:baseline;color:#eef2f8}
.todo li span{flex:none;background:rgba(232,195,122,.2);color:var(--gold);border:1px solid rgba(232,195,122,.4);font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px}
/* 사무실 바닥 */
.floor{position:relative;padding:4px 16px 58px;
  background:
   radial-gradient(ellipse 60% 40% at 30% 0%,rgba(255,220,160,.08),transparent 70%),
   radial-gradient(ellipse 50% 50% at 85% 30%,rgba(120,170,255,.06),transparent 70%),
   repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
   linear-gradient(180deg,#1b1f28,#14171d)}
.office{display:grid;grid-template-columns:repeat(4,1fr) 1.08fr;gap:10px 12px;max-width:1500px;margin:0 auto}
.cube{position:relative;cursor:pointer;transition:transform .18s}
.cube:hover{transform:translateY(-3px)}
.scene{position:relative;width:100%;aspect-ratio:640/518;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.scene img{position:absolute;display:block;pointer-events:none}
.scene .cub,.scene .df{left:0;top:0;width:100%;height:100%}
.scene .pp{height:auto}
.working .pp{animation:type .5s steps(2) infinite}
.working .pp.up{animation:type .5s steps(2) infinite}
.resting .pp{animation:sip 5s ease-in-out infinite}
.plate{position:absolute;left:6.6%;top:43.6%;width:12.6%;height:8.6%;display:flex;align-items:center;justify-content:center;
  font-size:clamp(8px,.78vw,11px);font-weight:800;color:#3a2614;text-align:center;line-height:1.05;letter-spacing:-.4px;
  text-shadow:0 1px 0 rgba(255,255,255,.35);overflow:hidden;white-space:nowrap}
.plate.long{font-size:clamp(7px,.6vw,8.5px);letter-spacing:-.8px}
.away{position:absolute;left:42%;top:48%;transform:translate(-10%,-50%);font-size:12px;font-weight:700;color:#5b6472;background:rgba(255,255,255,.75);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.glow{position:absolute;left:19%;top:16%;width:16%;height:26%;border-radius:50%;background:radial-gradient(ellipse,rgba(130,190,255,.6),transparent 70%);opacity:0;pointer-events:none}
.working .glow{animation:flicker 2.6s infinite}
/* 상태 카드(어두운 유리) */
.card{position:relative;margin:-4px 3% 0;padding:6px 10px 7px;border-radius:12px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.card .top{display:flex;align-items:center;gap:6px;font-size:13px}
.card .top b{font-weight:800;white-space:nowrap}
.card .top .role{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#777}
.working .dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s infinite}
.working .st{color:#b9f5d3}
.resting .dot,.asleep .dot{background:var(--amber);box-shadow:0 0 7px rgba(255,181,71,.8)}
.resting .st,.asleep .st{color:#ffd9a0}
.empty .st{color:#9aa3b2}
.did{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 파견 사원 유리 회의실 */
.side{display:flex;flex-direction:column;gap:10px;grid-row:1 / span 2;grid-column:5}

  border:2px solid rgba(160,200,255,.55);box-shadow:0 0 0 4px rgba(127,178,255,.12),0 12px 26px rgba(0,0,0,.45),inset 0 0 30px rgba(127,178,255,.18)}
.glassroom:before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.18) 0 8%,transparent 8% 22%,rgba(255,255,255,.08) 22% 26%,transparent 26%);z-index:3}
.glassroom .rlabel{position:absolute;left:10px;top:8px;z-index:4;font-size:11px;font-weight:800;color:#dbe8ff;letter-spacing:.5px}
.glassroom .badge{position:absolute;right:10px;top:7px;z-index:4;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(90deg,#3d6fd1,#5f8ff0);border-radius:999px;padding:2px 9px;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset}
.glassroom .scene{margin-top:14px}
.glassroom .card{margin:-2px 0 0;background:rgba(10,18,36,.7);border-color:rgba(160,200,255,.35)}
/* 수면실 */
.nap{flex:1;border-radius:16px;padding:9px 10px;background:linear-gradient(180deg,rgba(40,36,84,.85),rgba(24,22,52,.92));border:1px solid rgba(180,170,255,.25);
  box-shadow:inset 0 0 26px rgba(0,0,0,.5),0 10px 20px rgba(0,0,0,.35);min-height:120px;overflow:hidden}
.nap h2{font-size:13px;font-weight:800;color:#d9d3ff;display:flex;align-items:center;gap:6px}
.moon{width:13px;height:13px;border-radius:50%;box-shadow:-4px 1px 0 0 #ffe9a8;transform:translateX(4px)}
.beds{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bed{position:relative;width:calc(50% - 3px);height:74px;border-radius:10px;background:linear-gradient(180deg,#3a3570,#2b2760);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;cursor:pointer}
.bed img{height:66px;filter:brightness(.9);animation:breathe 3.5s ease-in-out infinite}
.bed .nm{position:absolute;left:6px;top:4px;font-size:10.5px;font-weight:700;color:#ffe9a8}
.z{position:absolute;right:14%;top:22%;font-weight:900;font-size:11px;color:#fff;opacity:0;animation:zz 3s infinite}
.z.b{animation-delay:1s}.z.c{animation-delay:2s;font-size:14px}
.emptytxt{font-size:11.5px;color:#b9b2e6}
/* 사용량 바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(12,14,20,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  color:var(--ink);padding:9px clamp(12px,2vw,24px);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.gauge{display:flex;align-items:center;gap:10px;min-width:260px;flex:1 1 320px}
.gauge .lbl{font-weight:700;font-size:13px;white-space:nowrap;color:var(--sub)}
.track{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.fill{height:100%;width:0;border-radius:999px;transition:width .8s,background .8s}
.gauge .pct{font-weight:800;font-size:13px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.gauge.unknown .track{background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 8px,rgba(255,255,255,.1) 8px 16px)}
.gauge.unknown .pct{color:#8a93a3}
.reset{font-size:11.5px;color:var(--sub);white-space:nowrap}
.shares{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.share{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub)}
.share .col{width:12px;background:rgba(255,255,255,.08);border-radius:3px;height:24px;display:flex;align-items:flex-end;overflow:hidden}
.share .col div{width:100%;background:var(--gold)}
/* 명령 창 */
.mask{display:none;position:fixed;inset:0;z-index:20;background:rgba(6,8,14,.55);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:16px}
.mask.on{display:flex}
.pop{width:min(440px,100%);background:linear-gradient(160deg,rgba(34,40,56,.96),rgba(18,22,32,.97));border:1px solid rgba(255,255,255,.18);border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);padding:18px 20px 16px;position:relative;color:var(--ink)}
.pop h3{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pop h3 small{font-size:11.5px;font-weight:700;color:var(--gold);background:rgba(232,195,122,.14);border:1px solid rgba(232,195,122,.35);border-radius:999px;padding:1px 9px}
.pop .pst{margin-top:7px;font-size:13px;color:var(--sub);line-height:1.5}
.pop .pst b{color:var(--ink)}
.pop textarea{width:100%;height:96px;margin-top:11px;border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:9px 11px;font:inherit;font-size:14px;resize:vertical;
  background:rgba(255,255,255,.06);color:var(--ink);outline:none}
.pop textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,195,122,.18)}
.pop .cnt{font-size:11px;color:#7f8898;text-align:right;margin-top:2px}
.pop .btns{display:flex;gap:8px;margin-top:8px}
.pop button{flex:1;font:inherit;font-weight:800;font-size:14.5px;border:none;border-radius:11px;padding:10px 8px;cursor:pointer}
.pop .go{background:linear-gradient(90deg,#e8c37a,#f3d89c);color:#1b1710}
.pop .go:disabled{opacity:.5;cursor:wait}
.pop .no{flex:none;background:rgba(255,255,255,.1);color:var(--ink);padding:10px 16px}
.pop .msg{margin-top:9px;font-size:13px;font-weight:700;min-height:1.2em;line-height:1.45}
.pop .msg.ok{color:#7ff0b0}.pop .msg.bad{color:#ff8a80}
.pop .hint{margin-top:6px;font-size:11.5px;color:#8a93a3;line-height:1.45}
.pop .x{position:absolute;right:12px;top:8px;background:none;border:none;font-size:22px;color:#8a93a3;cursor:pointer;flex:none;padding:0 4px}
@media (max-width:1000px) and (min-width:701px){.office{grid-template-columns:repeat(3,1fr)}.side{grid-column:auto;grid-row:auto}.todo{display:none}}

      else setMsg("못 보냈습니다: "+((r&&r.why)||"알 수 없는 오류"),false);});
    return;}
  var gid=GROK_IDS[p.id]; if(!gid){setMsg("이 사원은 아직 대화창 주소가 없습니다",false);return;}
  $("popGo").disabled=true;
  (t?copyText(t):Promise.resolve(null)).then(function(cp){
    return openGrok(gid).then(function(ok){ $("popGo").disabled=false;
      var a=ok?p.이름+" 대화창을 열었습니다.":"대화창을 못 열었습니다. Grok Bot 앱이 깔려 있는지 봐 주세요.";
      if(cp===true) a+=" 써 둔 명령은 복사해 뒀으니 입력칸에 붙여넣기(Ctrl+V) 하시면 됩니다.";
      else if(cp===false) a+=" 명령 복사는 안 됐습니다. 위 글을 직접 복사해 주세요.";
      setMsg(a,ok);});});};
function deskClick(e){var d=e.target.closest("[data-i]"); if(!d) return; var p=(window.OFFICE_STATUS||[])[+d.getAttribute("data-i")]; if(p) openPop(p);}
$("grid").addEventListener("click",deskClick);
if(IN_APP) setInterval(function(){fetch("/api/ping",{cache:"no-store"}).catch(function(){});},30000);
/* 같은 폴더의 status.json(인터넷 주소로 열 때) 또는 status.js(파일로 열 때)를 1분마다 읽음. 못 읽으면 위 내장 자료 그대로 */
var REMOTE_STATUS="https://gist.githubusercontent.com/all0phone/048d828855553946662d026f84b06487/raw/status.json";
function refresh(){
  fetch(REMOTE_STATUS+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(apply).catch(function(){});
  if(location.protocol!=="file:"){
    fetch("status.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(apply).catch(function(){});
  }
  var old=document.getElementById("statusjs"); if(old) old.remove();
  var sc=document.createElement("script"); sc.id="statusjs"; sc.src="status.js?t="+Date.now(); sc.onerror=function(){}; document.body.appendChild(sc);
}
function tick(){var d=new Date();document.getElementById("now").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
render(); tick(); refresh();
if(location.hash==="#claude") setTimeout(function(){var L=window.OFFICE_STATUS||[];for(var i=0;i<L.length;i++) if(L[i].id==="claude"){openPop(L[i]);break;}},600);
/* 새 사원 그림이 들어오면 img/hq/pos.json 만 바꿔도 반영 */
if(location.protocol!=="file:"&&!IS_WEB) fetch("img/hq/pos.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d){for(var k in d) HQ_POS[k]=d[k]; render();}}).catch(function(){});
setInterval(tick,10000); setInterval(refresh,60000); setInterval(render,60000);
</script>
</body>
